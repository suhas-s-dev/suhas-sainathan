{{ $p := site.Data.profile }}
{{ $home := "/" | relURL }}
<nav class="site-nav" aria-label="Primary navigation">
  <div class="container nav">
    <a class="brand" href="{{ $home }}" aria-label="{{ $p.name }} home"><span class="mark">SS</span><span>{{ $p.name }}</span></a>
    <div class="navlinks">
      <a class="nav-anchor" href="{{ $home }}#expertise">Expertise</a>
      <a class="nav-anchor" href="{{ $home }}#experience">Experience</a>
      <a class="nav-anchor" href="{{ $home }}#credentials">Credentials</a>
      <a href="{{ "/blog/" | relURL }}"{{ if eq .Section "blog" }} aria-current="page"{{ end }}>Blog</a>
      <a href="{{ "/watches/" | relURL }}"{{ if eq .RelPermalink ("/watches/" | relURL) }} aria-current="page"{{ end }}>Watches</a>
    </div>
    <a class="navcta" href="mailto:{{ $p.email }}">CONNECT ↗</a>
  </div>
</nav>
