hero:
  seconds: 5
  favorites:
    - slug: hmt-gandaberunda
      name: HMT Kannada Dial
      model: Kannada Dial (Gandaberunda)
      caliber: "manual wind · Kannada numerals"
      size: ~34mm steel
      year: HMT era
      note: >-
        Numerals in Kannada, the Gandaberunda — Karnataka's mythical two-headed bird —
        stamped at six o'clock. The rarest thing in the case, and the one that always gets
        a second look.
    - slug: hmt-janata
      name: HMT Janata
      model: Janata
      caliber: "manual wind · Para Shock"
      size: ~34mm steel
      year: HMT era
      note: >-
        The white-dial classic that started a thousand Indian collections. This exact
        reference used to just be Grail 01 on a list further down this page.
    - slug: casio-ae1200
      name: Casio AE-1200WD
      model: AE-1200WD World Time
      caliber: "digital quartz · world time"
      size: 41mm resin
      year: 1980s design, still sold
      note: >-
        World map, five alarms, ten-year battery — Bond-villain energy for the price of a
        pizza. This one used to just be on a list. Now it's on the wrist.
    - slug: bulova-chronograph
      name: Bulova Chronograph
      model: Crystal Chronograph
      caliber: "quartz chronograph · tri-register"
      size: ~43mm two-tone steel
      year: modern
      note: >-
        The one dressy enough to make the rest of the case look under-dressed. Crystal
        hour markers, a proper tachymeter-adjacent tri-register face, and a bracelet that
        actually catches light on purpose.

