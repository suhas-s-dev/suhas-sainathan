<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title2 desc2" font-family="'DM Sans',system-ui,sans-serif">
  <title id="title2">Daily average targeted sites, before vs after Operation Eastwood</title>
  <desc id="desc2">Bar chart. Before Operation Eastwood (Jun 24–Jul 13, 2025): 10 targeted sites per day on average. After Operation Eastwood (Jul 24–Aug 13, 2025): 18 targeted sites per day on average, an 80 percent increase.</desc>
  <rect x="0" y="0" width="760" height="400" fill="#f4f1e9"/>

  <text x="40" y="42" font-size="19" fill="#071c26" font-weight="700">Operation Eastwood didn't slow it down</text>
  <text x="40" y="64" font-size="13" fill="#52636a">Average number of sites targeted per day, before vs. after the July 2025 takedown</text>

  <!-- baseline -->
  <line x1="70" y1="330" x2="690" y2="330" stroke="rgba(7,28,38,.18)" stroke-width="1"/>
  <!-- gridline at 10 and 18 reference -->
  <line x1="70" y1="200" x2="690" y2="200" stroke="rgba(7,28,38,.12)" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Before bar: value 10 -> height 130 -->
  <rect x="220" y="200" width="140" height="130" fill="#0a2e40"/>
  <text x="290" y="188" font-size="20" fill="#071c26" font-weight="700" text-anchor="middle">10 / day</text>
  <text x="290" y="356" font-size="13.5" fill="#071c26" text-anchor="middle" font-weight="600">Before</text>
  <text x="290" y="374" font-size="12" fill="#52636a" text-anchor="middle">Jun 24 – Jul 13, 2025</text>

  <!-- After bar: value 18 -> height 234 -->
  <rect x="440" y="96" width="140" height="234" fill="#ff5c35"/>
  <text x="510" y="84" font-size="20" fill="#071c26" font-weight="700" text-anchor="middle">18 / day</text>
  <text x="510" y="356" font-size="13.5" fill="#071c26" text-anchor="middle" font-weight="600">After</text>
  <text x="510" y="374" font-size="12" fill="#52636a" text-anchor="middle">Jul 24 – Aug 13, 2025</text>

  <!-- delta annotation -->
  <path d="M 365 195 C 400 150, 400 150, 435 108" stroke="#ff5c35" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ff5c35"/>
    </marker>
  </defs>
  <text x="400" y="140" font-size="15" fill="#ff5c35" font-weight="700" text-anchor="middle">+80%</text>
</svg>
