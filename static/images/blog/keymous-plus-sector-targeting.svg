<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title1 desc1" font-family="Manrope,'DM Sans',system-ui,sans-serif">
  <title id="title1">Keymous+ claimed targets by sector</title>
  <desc id="desc1">Horizontal bar chart. Government 27.6%, Telecommunications 10.0%, Financial services 6.5%, all other sectors combined 55.9%.</desc>
  <rect x="0" y="0" width="760" height="360" fill="#111821"/>

  <text x="40" y="42" font-size="19" fill="#EEF4F8" font-weight="700">Where Keymous+ actually points its floods</text>
  <text x="40" y="64" font-size="13" fill="#96A4B4">Claimed targets by sector, 2023–2026</text>

  <!-- baseline -->
  <line x1="230" y1="90" x2="230" y2="300" stroke="rgba(238,244,248,.18)" stroke-width="1"/>

  <!-- Government -->
  <text x="210" y="118" font-size="14" fill="#EEF4F8" text-anchor="end">Government</text>
  <rect x="230" y="100" width="378" height="30" fill="#62F6B5"/>
  <text x="618" y="120" font-size="14" fill="#EEF4F8" font-weight="700">27.6%</text>

  <!-- Telecommunications -->
  <text x="210" y="170" font-size="14" fill="#EEF4F8" text-anchor="end">Telecommunications</text>
  <rect x="230" y="152" width="137" height="30" fill="#3A5774"/>
  <text x="377" y="172" font-size="14" fill="#EEF4F8" font-weight="700">10.0%</text>

  <!-- Financial services -->
  <text x="210" y="222" font-size="14" fill="#EEF4F8" text-anchor="end">Financial services</text>
  <rect x="230" y="204" width="89" height="30" fill="#3A5774"/>
  <text x="329" y="224" font-size="14" fill="#EEF4F8" font-weight="700">6.5%</text>

  <!-- All other sectors -->
  <text x="210" y="274" font-size="14" fill="#EEF4F8" text-anchor="end">All other sectors</text>
  <rect x="230" y="256" width="767" height="30" fill="#3A5774" opacity="0" />
  <rect x="230" y="256" width="500" height="30" fill="#2B3948"/>
  <text x="738" y="276" font-size="14" fill="#EEF4F8" font-weight="700">55.9%</text>

  <text x="40" y="330" font-size="12.5" fill="#96A4B4">Government sites are the single largest category, but the majority of claims spread thin across</text>
  <text x="40" y="348" font-size="12.5" fill="#96A4B4">education, manufacturing, and dozens of other opportunistic targets — consistent with a for-hire pattern.</text>
</svg>
