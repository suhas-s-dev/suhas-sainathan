<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title1 desc1" font-family="'DM Sans',system-ui,sans-serif">
  <title id="title1">Top targeted countries by share of NoName057(16) DDoSia activity, July 2024–July 2025</title>
  <desc id="desc1">Horizontal bar chart. Ukraine 29.47%, France 6.09%, Italy 5.39%, Sweden 5.29%, Germany 4.60%. Ukraine alone exceeds the next four countries combined.</desc>
  <rect x="0" y="0" width="760" height="400" fill="#f4f1e9"/>

  <text x="40" y="42" font-size="19" fill="#071c26" font-weight="700">Where NoName057(16) actually points DDoSia</text>
  <text x="40" y="64" font-size="13" fill="#52636a">Top 5 countries by share of targets, Jul 2024–Jul 2025</text>

  <!-- baseline -->
  <line x1="220" y1="90" x2="220" y2="352" stroke="rgba(7,28,38,.18)" stroke-width="1"/>

  <!-- Ukraine -->
  <text x="200" y="118" font-size="14" fill="#071c26" text-anchor="end">Ukraine</text>
  <rect x="220" y="100" width="491" height="30" fill="#ff5c35"/>
  <text x="726" y="120" font-size="14" fill="#071c26" font-weight="700">29.47%</text>

  <!-- France -->
  <text x="200" y="170" font-size="14" fill="#071c26" text-anchor="end">France</text>
  <rect x="220" y="152" width="102" height="30" fill="#0a2e40"/>
  <text x="332" y="172" font-size="14" fill="#071c26" font-weight="700">6.09%</text>

  <!-- Italy -->
  <text x="200" y="222" font-size="14" fill="#071c26" text-anchor="end">Italy</text>
  <rect x="220" y="204" width="90" height="30" fill="#0a2e40"/>
  <text x="320" y="224" font-size="14" fill="#071c26" font-weight="700">5.39%</text>

  <!-- Sweden -->
  <text x="200" y="274" font-size="14" fill="#071c26" text-anchor="end">Sweden</text>
  <rect x="220" y="256" width="88" height="30" fill="#0a2e40"/>
  <text x="318" y="276" font-size="14" fill="#071c26" font-weight="700">5.29%</text>

  <!-- Germany -->
  <text x="200" y="326" font-size="14" fill="#071c26" text-anchor="end">Germany</text>
  <rect x="220" y="308" width="77" height="30" fill="#0a2e40"/>
  <text x="307" y="328" font-size="14" fill="#071c26" font-weight="700">4.60%</text>

  <text x="40" y="382" font-size="12.5" fill="#52636a">Ukraine's share (29.47%) alone exceeds France, Italy, Sweden and Germany combined (21.37%).</text>
</svg>
