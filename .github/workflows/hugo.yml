name: Hugo build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - name: Build
        # Note: --panicOnWarning is intentionally omitted. Cloudflare Pages (the
        # actual production build) runs an older pinned Hugo without hugo.Data,
        # so templates use the still-functional but deprecated site.Data accessor.
        # That trips a WARN on newer Hugo that --panicOnWarning would turn fatal
        # here without reflecting a real production problem.
        run: hugo --minify
      - name: Check generated site
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          ! grep -R -E '/home/|/Users/|TODO|Lorem ipsum' public
